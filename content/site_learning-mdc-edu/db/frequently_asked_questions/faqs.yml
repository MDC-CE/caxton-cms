faqs:
  - id: opendoor#1
    question: What are the eligibility requirements?
    answer: >-
      To be considered for Open Door Grant funding, students must:

      - Be a Florida resident (Florida residency must be processed through the College's Admissions
      Office).

      - Be a United States citizen, permanent resident, or eligible noncitizen.

      - Be enrolled in an eligible workforce program at Miami Dade College.

      - Complete the Open Door Grant application provided by the Department of Continuing Education
      and Professional Development (CEPD) if enrolled in a noncredit program.
    locale: en
    fuente: >-
      playground:apps/playground/data/opendoor.yml (official_ce) |
      https://ce.mdc.edu/contentManagement.do?method=load&code=CM000019
    fecha: "2026-10-22"
    last_updated: "2026-10-22"
    priority: 1
    locations:
      - all
    status: official_ce
