  - id: opendoor#2
    question: How much funding can I receive?
    answer: >-
      The Open Door Grant provides a maximum award equal to the amount needed to cover up to 100% of
      tuition and fees for eligible programs. Funding is subject to availability and approval.
      Submission of an application does not guarantee an award.
