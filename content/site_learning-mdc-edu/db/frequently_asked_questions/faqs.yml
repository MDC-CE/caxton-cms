  - id: opendoor#7
    question: How do I apply?
    answer: >-
      Students interested in a noncredit program should complete the Open Door Grant application
      using the application link provided on this webpage. Applicants must also complete the
      applicable Florida Residency process through the Office of Admissions. Applications are
      reviewed to determine whether students meet the applicable requirements and whether funding is
      available.
