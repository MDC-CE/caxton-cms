# Full vhost for learning.mdc.edu — Caxton at domain root (no /caxton, no /aielite).
# Install as /etc/nginx/sites-available/learn-mdc (symlink from sites-enabled), then:
#   nginx -t && systemctl reload nginx
#
# Optional: temporary redirects from legacy /caxton and /aielite paths (uncomment).

server {
    listen 80;
    server_name learning.mdc.edu learn.mdc.edu;

    # Match multer on POST /api/image-registry/upload (100 MB).
    # Default is 1m: videos get an HTML 413 page and the editor shows a JSON parse error.
    # Repeat this directive on the HTTPS server block if certbot split it out.
    client_max_body_size 100m;

    # Legacy path → root (optional; remove after clients stop using them)
    location = /caxton { return 301 /; }
    location /caxton/ { return 301 /; }
    location = /aielite { return 301 /; }
    location /aielite/ { return 301 /; }

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # No X-Forwarded-Prefix — app serves at domain root (APP_BASE empty).
        # Large video uploads: don't cut the connection at the 60s default.
        client_body_timeout 300s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }
}
