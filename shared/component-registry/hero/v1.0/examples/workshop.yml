name: "Workshop event hero (static preview)"
description: >-
  Standalone workshop detail hero with hardcoded copy, seats, host, and LeadForm.
  No {{ entry.* }} bindings — use this for component preview without a workshop content type.
yaml: |
  - type: hero
    version: "1.0"
    variant: workshop
    back_label: Back to workshops
    back_url: /workshops
    badge: AI Trends
    title: >-
      <span style="font-size: 3.5rem; letter-spacing: -0.02em; line-height: 1.03; font-weight: 800">Back to the Job Search with <em>AI</em></span>
    description: |
      Build a real solution live with Marcelo Ricigliano, CEO of 4Geeks Academy.

      Bring your curiosity — no expert skills required.
    date:
      starting_at_iso: "2030-06-15T17:30:00Z"
      ending_at_iso: "2030-06-15T18:45:00Z"
      icon: Calendar
    duration:
      label: 1h 15m
      suffix: long
      icon: Clock
    host:
      heading: Host for this event
      name: Marcelo Ricigliano
      avatar_url: man-profile-headshot-1-0850c276
      bio: CEO and co-founder of 4Geeks Academy.
      socials:
        - name: Twitter
          url: "https://twitter.com/4GeeksAcademy"
          icon: Twitter
        - name: LinkedIn
          url: "https://www.linkedin.com/school/4geeksacademy/"
          icon: Linkedin
        - name: Website
          url: "https://4geeks.com"
          icon: Globe
    seats:
      capacity: 150
      registered_count: 101
      remaining: 49
      copy: 101 people are already registered in this event. 49 more spots available
      load_more_label: Load more
      registrants:
        - woman-profile-headshot-1-608aff01
        - man-profile-headshot-1-0850c276
        - woman-profile-headshot-2-a0ea2c29
        - man-profile-headshot-2-516b72e4
      fallback_avatars: []
    live:
      label: Live now
      images:
        - "https://github-production-user-asset-6210df.s3.amazonaws.com/426452/264811559-ff8d2a4e-0a34-41c9-af90-57b0a96414b3.gif"
        - "https://github-production-user-asset-6210df.s3.amazonaws.com/426452/264811551-c4cadebe-9bea-4abe-9d11-4c19d5b66241.gif"
        - "https://github-production-user-asset-6210df.s3.amazonaws.com/426452/264811556-1d9de108-2166-4803-8014-1e1d406066a2.gif"
        - "https://github-production-user-asset-6210df.s3.amazonaws.com/426452/264811564-e7889add-dd02-4b91-bb0b-91b9e5f843af.gif"
    countdown:
      background_image: /static/videos/bubbles_2.gif
    form_card_disclaimer: No spam. Unsubscribe anytime.
    form:
      variant: stacked
      is_signup: true
      conversion_name: workshop_registration
      submit_label: Register
      fields:
        email:
          visible: true
          required: true
        first_name:
          visible: true
          required: true
        last_name:
          visible: true
          required: false
        phone:
          visible: false
          required: false
      messages:
        guest:
          title: Register for this workshop
          subtitle: Create an account to save your seat
          submit_label: Register
        login:
          title: Register for this workshop
          subtitle: Log in to save your seat
          submit_label: Log in
          back_label: Back to create account
        incomplete:
          title: Register for this workshop
          subtitle: We still need a couple of details
          submit_label: Continue
        ready:
          title: Register for this workshop
          subtitle: You are registered for this workshop
          submit_label: Continue
    calendar_cta:
      heading: Want a reminder? Add this event to your calendar!
      text: Add to calendar
      variant: primary
      icon: Calendar
      items:
        - name: Google
          url: "https://calendar.google.com/calendar/render?action=TEMPLATE&text=Demo"
        - name: Outlook.com
          url: "https://outlook.live.com/owa/?rru=addevent"
        - name: Yahoo
          url: "https://calendar.yahoo.com/?v=60&view=d&type=20"
    maxWidth:
      desktop: xl
