name: Text Block
version: "1.0"
component: TextBlock
file: client/src/components/text_block/variants/TextBlockDefault.tsx
description: >-
  A standalone block of formatted copy — an optional eyebrow label, an optional heading, and a rich-text body. Use
  wherever editors need to drop in prose without repurposing a more complex layout component.
when_to_use: |
  Use for editorial content that is purely text: policy copy, long-form explanations,
  marketing prose, or any section that needs a heading and rich paragraph body without
  columns, images, or interactive elements. Supports alignment and max-width constraints
  to control readability across wide layouts.
props:
  eyebrow:
    type: string
    required: false
    description: Small label rendered above the heading (e.g. "About us", "New")
  heading:
    type: string
    required: false
    description: Section heading displayed below the eyebrow
  body:
    type: string
    required: true
    description: Rich text body stored as HTML (produced by the WYSIWYG editor)
  alignment:
    type: string
    required: true
    description: "Text alignment: 'left' (default), 'center', or 'right'"
  max_width:
    type: string
    required: true
    description: "Constrains readable line length: 'narrow', 'default' (default), or 'wide'"
variants:
  default:
    content_shape:
      image: unused
      icon: unused
      sample_pages: 1
      measured_at: "2026-10-02"
    best_for: >-
      Standalone editorial text sections with an optional eyebrow, heading, and rich-text body on pages focused purely
      on prose content.
    avoid_when: Any page section needing images, icons, columns, cards, or interactive elements beyond basic formatted text.
    metadata_status: draft
