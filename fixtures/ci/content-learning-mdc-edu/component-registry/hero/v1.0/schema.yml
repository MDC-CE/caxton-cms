text_limits:
  productShowcase:
    - label: Welcome text
      fields:
        - welcome_text
      max_length: 40
    - label: H1
      fields:
        - brand_mark.prefix
        - brand_mark.highlight
        - brand_mark.suffix
      max_length: 70
    - label: H2
      fields:
        - title
      max_length: 60
    - label: H1 + H2
      fields:
        - brand_mark.prefix
        - brand_mark.highlight
        - brand_mark.suffix
        - title
      max_length: 90
    - label: Subtitle
      fields:
        - subtitle
      max_length: 80
    - label: Description
      fields:
        - description
      max_length: 180
    - label: Bullets
      list: bullets
      item_field: text
      max_items: 4
      item_max_length: 120
