name: DynamicTable
version: "1.0"
component: DynamicTable
file: client/src/components/DynamicTable.tsx
description: >-
  A sortable table that lists rows from a private database or content type via dynamic_entries (same listing pipeline as
  list_cards / FAQ). Keeps table layouts (default, striped, cards, comparison), typed columns, optional row actions, and
  max_rows expand/collapse. Rows are SSR-resolved into items — not fetched from a client endpoint.
when_to_use: >
  Use for tabular listings over a database or content type (e.g. upcoming cohorts). Prefer this when staff need
  filters/sort/limit via dynamic_entries and a table UI. Do not use for arbitrary live API URLs — connect a private
  database instead.
behaviors:
  listing:
    source: dynamic_entries
    notes: >
      Mapping fields + queries render table rows from a content type / DB. Author via dynamic_entries; items are
      runtime-resolved. Empty lists still show the table chrome with empty_text.
props:
  variant:
    type: string
    required: false
    options:
      - default
      - striped
      - cards
      - comparison
    description: >-
      Visual style of the table. Options: 'default' (classic bordered table), 'striped' (alternating row colors with a
      colored header), 'cards' (responsive card layout on mobile, refined table on desktop), 'comparison'
  title:
    type: string
    required: false
    description: Main heading displayed above the table
  subtitle:
    type: string
    required: false
    description: Supporting text below the title
  background:
    type: string
    required: false
    description: Background color or gradient for the section
  empty_text:
    type: string
    required: false
    description: Message shown when there are no rows. Section chrome stays visible.
  columns:
    type: array
    required: true
    items:
      key:
        type: string
        required: true
        description: Item property key (matches item_template output)
      label:
        type: string
        required: true
        description: Display label for the column header
      type:
        type: string
        required: true
        options:
          - text
          - number
          - date
          - image
          - link
          - boolean
        description: "Column type: text, number, date, image, link, or boolean"
    description: Array of column definitions
  action:
    type: object
    required: false
    properties:
      label:
        type: string
        required: true
        description: Button text (e.g., "Apply", "View")
      href:
        type: string
        required: true
        description: >-
          URL per row. Use {columnKey} placeholders against resolved item fields (e.g. '{apply_url}'), or a fixed path
          like '/en/apply'.
    description: Optional action button for each row
  max_rows:
    type: number
    required: false
    description: >-
      Maximum number of rows to display initially. When set, a 'Show all' button appears to expand the full list. Leave
      empty to show all rows.
  items:
    type: array
    required: false
    description: Runtime-resolved rows from dynamic_entries (not authored).
  dynamic_entries:
    type: object
    required: false
    description: Listing query — database or content_type plus filters, sort, limit, item_template
    properties:
      - name: content_type
        type: string
      - name: database
        type: string
        example: upcoming_cohorts
      - name: limit
        type: number
      - name: sort
        type: string
      - name: search
        type: string
      - name: item_template
        type: object
      - name: permanent_filters
        type: array
      - name: user_filters
        type: array
      - name: hardcoded_entries
        type: array
      - name: ignored_entries
        type: array
variants:
  cards: {}
  comparison: {}
  default: {}
  striped: {}
