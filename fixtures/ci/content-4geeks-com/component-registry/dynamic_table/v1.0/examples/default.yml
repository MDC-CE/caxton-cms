name: "Default"
description: "Cohort overview table listing rows from the upcoming_cohorts private database"
yaml: |
  - type: dynamic_table
    version: "1.0"
    variant: comparison
    title: Cohort Overview
    empty_text: No upcoming cohorts.
    dynamic_entries:
      database: upcoming_cohorts
      sort: kickoff_date
      limit: 50
      item_template:
        date: "{{ entry.date_label }}"
        program: "{{ entry.program_label }}"
        location: "{{ entry.location_label }}"
        duration: "{{ entry.duration_label }}"
    columns:
      - key: date
        label: Date
        type: text
      - key: program
        label: Program
        type: text
      - key: location
        label: Location
        type: text
      - key: duration
        label: Duration
        type: text
    action:
      label: Apply
      href: /en/apply
