name: "Single Column with Muted Overlay Video"
description: "Home-style singleColumn hero with muted-overlay YouTube autoplay and CTA below the video"
yaml: |
  - type: hero
    version: "1.0"
    variant: singleColumn
    badge: Bootcamps that launch careers
    title: Empowering Talent for the AI Era
    cta_below_media: true
    cta_buttons:
      - text: Apply now
        url: /us/apply
        variant: primary
    video:
      url: https://www.youtube.com/watch?v=5yTdymC3AA8
      ratio: "16:9"
      autoplay: true
      loop: true
      overlay_on_muted:
        title: Tu video ya ha comenzado
        subtitle: Haga clic para escuchar
        icon: volume-off
        restart_video_on_click: true
      open_modal_on_click: false
