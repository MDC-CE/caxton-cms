name: Lead Form
version: "1.0"
component: LeadForm
file: client/src/components/LeadForm.tsx
description: >-
  Lead capture form with configurable fields, auto-detection from session, and consent checkboxes. Submits to marketing
  API.
when_to_use: |
  Use this component when you need to collect user information for lead generation:
  - Program signup pages
  - Landing pages with contact forms
  - Request information sections
  - Newsletter signups with extended data collection
behaviors:
  conversion:
    via: form-settings
    notes: Fires conversion_name on submit; Forms tab edits defaults.
props:
  variant:
    type: string
    required: false
    options:
      - stacked
      - inline
    description: Layout variant to use
    example: stacked
  conversion_name:
    type: string
    required: false
  title:
    type: string
    required: false
  subtitle:
    type: string
    required: false
    description: Supporting text above the fields (also overridable per signup phase via messages)
    example: Get free information about our programs
  submit_label:
    type: string
    required: false
    description: Text for the submit button
    example: Request Info
  tags:
    type: string
    required: false
    description: Tags to associate with the lead
    example: website-lead,landing-page
  automations:
    type: string
    required: false
    description: Automation level for the lead
    example: strong
  webhook:
    type: object
    required: false
    properties:
      url:
        type: string
        required: false
        description: >-
          Destination URL to POST/GET the conversion payload. May include {{ entry.* }} /
          {{ visitor.* }} templates. Optional when only use_visitor_token is set.
        example: https://hooks.zapier.com/hooks/catch/xxxxx/yyyyy/
      method:
        type: string
        required: false
        description: HTTP method (default POST)
        example: POST
      use_visitor_token:
        type: boolean
        required: false
        description: >-
          When true, send Authorization Token on delivery (if url) and append ?token= to
          success.url when redirecting.
      fail_on_error:
        type: boolean
        required: false
        description: >-
          When true, wait for the upstream webhook and fail the form submit (no success UI /
          redirect) if delivery errors or returns non-2xx. Default omit/false is fire-and-forget.
    description: >-
      Form-level webhook — highest priority in the three-level chain (form > per-event > global). When set, this webhook
      is always used for this form regardless of tracking settings. Requires url and/or use_visitor_token.
