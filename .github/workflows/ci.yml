name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # site_* / sites.yml are gitignored. Seed before typecheck + tests.
      - name: Install CI content fixture
        run: npx tsx scripts/ensure-ci-content-fixture.ts --force

      - name: Typecheck MCP server
        run: npm run check:mcp

      - name: Typecheck
        run: npm run check

      - name: Unit tests
        # Single worker avoids SQLITE_BUSY on shared db-cache.sqlite across Vitest pools.
        run: npx vitest run --maxWorkers=1
