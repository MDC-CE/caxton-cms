name: Deploy Caxton to learning.mdc.edu

# Sole deploy target for this repo: /opt/caxton on the MDC droplet (learning.mdc.edu at domain root).
# Secrets: LEARNING_DEPLOY_HOST, LEARNING_DEPLOY_USER, LEARNING_DEPLOY_SSH_KEY,
#          LEARNING_DEPLOY_SSH_KNOWN_HOSTS
# Runtime: pack keys prefixed _CAXTON_ → WEBSITE_RUNTIME_B64 (consumed by scripts/deploy.sh).
# Required packed keys include: DATABASE_URL, SESSION_SECRET, SITE_URL, PORT,
# TURNSTILE_SITE_KEY, TURNSTILE_SECRET_KEY, GITHUB_TOKEN, …
# Domain root: do NOT set APP_BASE (or leave empty). SITE_URL=http(s)://learning.mdc.edu
# (Subpath /caxton is retired for this host.)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "client/**"
      - "server/**"
      - "shared/**"
      - "mcp-server/**"
      - "scripts/deploy.sh"
      - "scripts/start-production.sh"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - ".github/workflows/deploy-caxton-learning.yml"
      - "docs/learning-mdc-caxton.md"

concurrency:
  group: deploy-caxton-learning
  # Cancels the Actions observer only. deploy.sh runs detached on the VPS and keeps
  # going (abort soft pre-flip via .deploy-state/<sha>.abort if cancelled()).
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Pack _CAXTON_ runtime env
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
          VARS_JSON: ${{ toJSON(vars) }}
        run: |
          python3 << 'PY'
          import base64
          import json
          import os

          prefix = "_CAXTON_"
          secrets = json.loads(os.environ.get("SECRETS_JSON") or "{}")
          variables = json.loads(os.environ.get("VARS_JSON") or "{}")
          if not isinstance(secrets, dict):
              secrets = {}
          if not isinstance(variables, dict):
              variables = {}
          merged = dict(variables)
          merged.update(secrets)
          out = {}
          for key, value in merged.items():
              if not isinstance(key, str) or not key.startswith(prefix):
                  continue
              name = key[len(prefix) :]
              if not name or value is None or str(value) == "":
                  continue
              out[name] = str(value)
          packed = base64.b64encode(json.dumps(out, separators=(",", ":")).encode()).decode("ascii")
          # Base64 blob is not an exact match for any single secret, so Actions
          # would not mask it if it leaked into logs. Register it explicitly.
          print(f"::add-mask::{packed}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write(f"WEBSITE_RUNTIME_B64={packed}\n")
          print("[runtime-env] packed", len(out), "keys:", ", ".join(sorted(out)) or "(none)")
          PY

      - name: Skip if not latest commit
        id: latest
        env:
          EXPECTED_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          LATEST="$(git ls-remote "https://github.com/${REPO}.git" refs/heads/main | cut -f1)"
          if [ -z "$LATEST" ]; then
            echo "Unable to resolve latest SHA for main" >&2
            exit 1
          fi
          if [ "$LATEST" != "$EXPECTED_SHA" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "A newer commit is already on main ($LATEST), skipping deploy for $EXPECTED_SHA"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Deploying latest SHA $EXPECTED_SHA"
          fi

      - name: Setup SSH key
        if: steps.latest.outputs.skip != 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.LEARNING_DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.LEARNING_DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "${DEPLOY_SSH_KEY:-}" ]]; then
            echo "ERROR: secret LEARNING_DEPLOY_SSH_KEY is missing or empty." >&2
            exit 1
          fi
          if [[ -z "${DEPLOY_SSH_KNOWN_HOSTS:-}" ]]; then
            echo "ERROR: secret LEARNING_DEPLOY_SSH_KNOWN_HOSTS is missing or empty." >&2
            exit 1
          fi
          KEY="$RUNNER_TEMP/gha_deploy"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$KEY"
          chmod 600 "$KEY"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          echo "[deploy] SSH key and known_hosts written"

      - name: Deploy via SSH
        id: deploy
        if: steps.latest.outputs.skip != 'true'
        env:
          DEPLOY_HOST: ${{ secrets.LEARNING_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.LEARNING_DEPLOY_USER }}
          WEBSITE_RUNTIME_B64: ${{ env.WEBSITE_RUNTIME_B64 }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/gha_deploy"

          # Empty secrets make ssh print "usage:" with destination "@" — fail clearly.
          if [[ -z "${DEPLOY_HOST:-}" ]]; then
            echo "ERROR: secret LEARNING_DEPLOY_HOST is missing or empty (repo Settings → Secrets)." >&2
            exit 1
          fi
          if [[ -z "${DEPLOY_USER:-}" ]]; then
            echo "ERROR: secret LEARNING_DEPLOY_USER is missing or empty." >&2
            exit 1
          fi
          if [[ ! -s "$KEY" ]]; then
            echo "ERROR: LEARNING_DEPLOY_SSH_KEY missing/empty — Setup SSH key wrote an empty file." >&2
            exit 1
          fi
          if [[ ! -s "$HOME/.ssh/known_hosts" ]]; then
            echo "ERROR: LEARNING_DEPLOY_SSH_KNOWN_HOSTS missing/empty." >&2
            exit 1
          fi
          echo "[deploy] SSH target ${DEPLOY_USER}@${DEPLOY_HOST}"

          {
            printf 'export WEBSITE_RUNTIME_B64=%q\n' "$WEBSITE_RUNTIME_B64"
            printf 'export DEPLOY_SHA=%q\n' "$DEPLOY_SHA"
            printf 'export APP_ROOT=%q\n' "/opt/caxton"
            printf 'export SERVICE_NAME=%q\n' "caxton"
            printf 'export SIDEQUEST_SERVICE_NAME=%q\n' "caxton-sidequest"
            printf 'export HEALTH_PORT=%q\n' "5001"
            cat <<'REMOTE'
          set -euo pipefail
          APP_ROOT="${APP_ROOT:-/opt/caxton}"
          STATE_DIR="$APP_ROOT/.deploy-state"
          : "${DEPLOY_SHA:?DEPLOY_SHA is required}"

          mkdir -p "$STATE_DIR"
          LOG="$STATE_DIR/${DEPLOY_SHA}.log"
          DONE_MARK="$STATE_DIR/${DEPLOY_SHA}.done"
          rm -f "$DONE_MARK"

          git -C "$APP_ROOT" fetch --prune origin "$DEPLOY_SHA"
          SCRIPT="/tmp/caxton-deploy-${DEPLOY_SHA}.sh"
          git -C "$APP_ROOT" show "${DEPLOY_SHA}:scripts/deploy.sh" > "$SCRIPT"
          chmod +x "$SCRIPT"

          setsid nohup bash -c '
            set +e
            export APP_ROOT SERVICE_NAME SIDEQUEST_SERVICE_NAME HEALTH_PORT
            "'"$SCRIPT"'"
            ec=$?
            echo "$ec" > "'"$DONE_MARK"'"
            exit "$ec"
          ' > "$LOG" 2>&1 < /dev/null &
          disown || true
          echo "[deploy] launched detached, log $LOG done $DONE_MARK"

          offset=0
          for _ in $(seq 1 900); do
            if [[ -f "$DONE_MARK" ]]; then
              size=$(stat -c %s "$LOG" 2>/dev/null || echo 0)
              if [[ "$size" -gt "$offset" ]]; then
                tail -c +"$((offset + 1))" "$LOG" || true
              fi
              exit "$(cat "$DONE_MARK")"
            fi
            size=$(stat -c %s "$LOG" 2>/dev/null || echo 0)
            if [[ "$size" -gt "$offset" ]]; then
              tail -c +"$((offset + 1))" "$LOG" || true
              offset=$size
            fi
            sleep 2
          done
          echo "[deploy] timeout observing (deploy may still be running on the VPS — see $LOG)" >&2
          exit 1
          REMOTE
          } | ssh -i "$KEY" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=50 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'bash -s'

      - name: Signal abort on cancel
        if: cancelled() && steps.latest.outputs.skip != 'true'
        env:
          DEPLOY_HOST: ${{ secrets.LEARNING_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.LEARNING_DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.LEARNING_DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.LEARNING_DEPLOY_SSH_KNOWN_HOSTS }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set +e
          KEY="$RUNNER_TEMP/gha_deploy_abort"
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$KEY"
          chmod 600 "$KEY"
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          ssh -i "$KEY" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=15 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "mkdir -p /opt/caxton/.deploy-state && touch /opt/caxton/.deploy-state/${DEPLOY_SHA}.abort && echo abort-signaled"

      - name: Report actual deploy outcome
        if: always() && steps.latest.outputs.skip != 'true'
        env:
          DEPLOY_HOST: ${{ secrets.LEARNING_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.LEARNING_DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.LEARNING_DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.LEARNING_DEPLOY_SSH_KNOWN_HOSTS }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set +e
          umask 077
          KEY="$RUNNER_TEMP/gha_deploy"
          if [[ ! -f "$KEY" ]]; then
            printf '%s\n' "$DEPLOY_SSH_KEY" > "$KEY"
            chmod 600 "$KEY"
          fi
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          # Wait up to ~10m so abort mid-npm-ci/build can still land in .done.
          RESULT="NOT_FOUND"
          ABORT="no"
          for _ in $(seq 1 300); do
            OUT="$(ssh -i "$KEY" \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -o ConnectTimeout=15 \
              "${DEPLOY_USER}@${DEPLOY_HOST}" \
              "set -e; D=/opt/caxton/.deploy-state/${DEPLOY_SHA}; if [[ -f \"\$D.abort\" ]]; then echo ABORT=yes; else echo ABORT=no; fi; if [[ -f \"\$D.done\" ]]; then echo DONE=\$(cat \"\$D.done\"); else echo DONE=NOT_FOUND; fi" 2>/dev/null)"
            ABORT="$(echo "$OUT" | sed -n 's/^ABORT=//p' | tail -1)"
            RESULT="$(echo "$OUT" | sed -n 's/^DONE=//p' | tail -1)"
            if [[ -n "$RESULT" && "$RESULT" != "NOT_FOUND" ]]; then
              break
            fi
            sleep 2
          done

          {
            echo "## Estado real del deploy en el VPS"
            echo ""
            echo "- SHA: \`${DEPLOY_SHA}\`"
            if [[ "$RESULT" == "0" ]]; then
              echo "- ✅ **Deploy completado** (\`current\` apunta a este SHA). Si el job de Actions figura Cancelled, solo se cortó la observación — el proceso en el servidor terminó bien."
            elif [[ "$RESULT" == "NOT_FOUND" && "$ABORT" == "yes" ]]; then
              echo "- ⏹ Abort solicitado y aún sin \`.done\` tras ~10m. Puede seguir en \`npm ci\`/build o en \`handle_abort\`. Revisá el log o el próximo job para el estado final."
            elif [[ "$RESULT" == "NOT_FOUND" ]]; then
              echo "- ⏳ Sin \`.done\` aún tras ~10m — el deploy puede seguir en el VPS. Revisá \`/opt/caxton/.deploy-state/${DEPLOY_SHA}.log\` o el próximo job."
            else
              echo "- ❌ Deploy terminó con código \`$RESULT\` (falló; rollback de \`current\` si correspondía)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "summary: done=$RESULT abort=$ABORT"
